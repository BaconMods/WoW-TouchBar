# Publishes site/ (plain HTML, no build step) to GitHub Pages.
# Only useful in the PUBLIC repo: Pages on a private repo needs a paid plan, and Actions minutes are free
# for public repos. One-time setup there: Settings > Pages > Source: "GitHub Actions"
# (scripts\release\Publish-Public.ps1 -EnablePages does this for you).
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
